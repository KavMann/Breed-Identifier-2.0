services:
  - type: web
    name: breed-identifier
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DOGBREED_DEVICE
        value: cpu
      - key: TORCH_NUM_THREADS
        value: 1
      - key: DOGBREED_TTA
        value: false
      - key: DOGBREED_DOG_REJECTION
        value: false
      - key: DOGBREED_GRADCAM
        value: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false
